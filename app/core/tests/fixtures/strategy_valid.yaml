solana:
  collection:
    version: "v1"
    query_templates:
      - id: sol_m5_trending
        endpoint: megafilter
        sort: m5_trending
        poll_seconds: 30
        pages: 1
        query:
          networks: solana
      - id: sol_m5_pcp
        endpoint: megafilter
        sort: m5_price_change_percentage_desc
        poll_seconds: 120
        pages: 1
        query:
          networks: solana
