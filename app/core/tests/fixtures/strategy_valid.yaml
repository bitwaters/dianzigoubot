      enabled: true
      max_source_rank: 10
    anomaly:
      enabled: true
      volume_acceleration_ratio_min: "2"
      buy_sell_tx_ratio_min: "1.2"
      price_change_5m_abs_pct_min: "5"
    new_pool:
      enabled: true
