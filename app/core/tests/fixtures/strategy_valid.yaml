        endpoint: trending_pools
        sort: endpoint_default
        poll_seconds: 120
        pages: 1
        query:
          duration: 5m
      - id: sol_new
        endpoint: new_pools
        sort: endpoint_default
        poll_seconds: 180
        pages: 1
        query: {}
